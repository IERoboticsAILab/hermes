[pytest]
# rosbot_urdf_bundle holds vendored third-party robot descriptions. Their tests
# import `xacro`, which is not part of the H.E.R.M.E.S environment, and the
# import error aborts collection for the entire repo -- so `pytest -q` from the
# root fails before running a single H.E.R.M.E.S test. Skip the bundle.
norecursedirs = rosbot_urdf_bundle .claude build install log *.egg-info
