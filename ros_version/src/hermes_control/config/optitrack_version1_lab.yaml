# OptiTrack Version 1: a single NatNet client runs on the Pi and publishes a
# pose beacon for every robot. The ROSbots run agent-only launches and never
# talk to Motive, so Motive only ever sees one client -- which is what unicast
# streaming can actually serve.
#
# Order matters: robot_ids[i] is paired with rigid_body_names[i].
# AIfred_umh is spelled with a capital "I", not a lowercase "L".
optitrack_pose_beacon_node:
  ros__parameters:
    frame_id: optitrack
    robot_ids: [r1, r2, r3]
    rigid_body_names: [GAME_Player3, GAME_Player2, AIfred_umh]
    planar_x_axis: x
    # Motive streams Z-up: the floor plane is x/y and z is height. Reading z
    # here made every robot sit at a constant ~0.21 m (marker height) and hid
    # all motion along the real y axis.
    planar_y_axis: y
    forward_axis: x
